html<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links</title>
    <style>
        body { 
            background: linear-gradient(135deg, #0f0f12, #1c1c24); 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            padding: 40px 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #00aff0;
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 8px 24px rgba(0, 175, 240, 0.2);
        }
        h1 { font-size: 22px; margin: 0 0 5px 0; font-weight: 700; }
        .username { color: #888; font-size: 14px; margin-bottom: 30px; }
        
        /* Стили для кнопок */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 300px;
        }
        .btn { 
            display: block; 
            padding: 16px 0; 
            color: white; 
            text-decoration: none; 
            border-radius: 50px; 
            font-weight: 700; 
            font-size: 16px; 
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn:active { transform: scale(0.97); }

        /* Цвета для разных платформ */
        .onlyfans { 
            background: #00aff0; 
            box-shadow: 0 6px 20px rgba(0, 175, 240, 0.3);
        }
        .instagram { 
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); 
            box-shadow: 0 6px 20px rgba(220, 39, 67, 0.3);
        }
        .tiktok { 
            background: #000000; 
            border: 1px solid #25f4ee;
            box-shadow: 0 6px 20px rgba(37, 244, 238, 0.2);
        }
    </style>
</head>
<body>

    <!-- Ваша Аватарка (подгружается из папки GitHub) -->
    <img src="avatar.jpg.JPG" alt="Avatar" class="avatar">

    <h1>Мои Соцсети</h1>
    <div class="username">@ваш_ник</div>

    <!-- Контейнер с кнопками -->
    <div class="btn-container">
        <a href="https://onlyfans.com/mead0ll" target="_blank" class="btn onlyfans">🔥 OnlyFans</a>
        <a href="https://www.instagram.com/meadoll_" target="_blank" class="btn instagram">📸 Instagram</a>
        <a href="ССЫЛКА_НА_TIKTOK" target="_blank" class="btn tiktok">🎵 TikTok</a>
    </div>

</body>
</html>
